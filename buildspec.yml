version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20    # ⚠️ Your original had 25 — AWS doesn't support that yet!
    commands:
      - echo "Installing dependencies..."
      - npm ci    # 'ci' is better than 'install' — it uses package-lock.json exactly
  
  build:
    commands:
      - echo "Building the Next.js app..."
      - npm run build

artifacts:    # ← NEW: This tells CodeBuild what to save
  files:
    - '**/*'     # Save everything (for now)
  base-directory: .next   # Only save the built output fold